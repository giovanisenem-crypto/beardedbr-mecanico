name: Build CNC Master APK
on:
  push:
    paths:
      - 'cnc-master/**'
      - '.github/workflows/build-cnc-master.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnc-master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Master-V1-APK
          path: cnc-master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
