name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BeardedBR-Mecanico-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BeardedBR-Mecanico-APK
          path: BeardedBR-Mecanico-v1.apk
          retention-days: 30
