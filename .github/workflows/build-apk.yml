name: Gerar APK Forja Plataforma
on:
  workflow_dispatch:
  push:
    branches: [ codex/forja-plataforma-v1 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Forja-de-Aco-Plataforma-v13.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-de-Aco-Plataforma-V13.0-APK
          path: Forja-de-Aco-Plataforma-v13.0.apk
          retention-days: 30
