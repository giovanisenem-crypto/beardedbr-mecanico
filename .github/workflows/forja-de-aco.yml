name: Forja de Aço — APK
on:
  push:
    branches: [ "codex/forja-de-aco" ]
    paths: [ "forja-de-aco/**", ".github/workflows/forja-de-aco.yml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar jogo
        run: node --check forja-de-aco/app/src/main/assets/game.js
      - name: Compilar APK Android
        working-directory: forja-de-aco
        run: gradle assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Forja-de-Aco-Pixel-APK
          path: forja-de-aco/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
