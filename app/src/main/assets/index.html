function drawPlayer(){if(P.inv%8>4)return;let q=P.x-G.cam,y=P.y;if(art.hero.complete){x.save();let bob=P.on?Math.sin(P.run)*Math.min(3,Math.abs(P.vx)):(P.vy<0?-2:2),tilt=P.on?P.vx*.012:P.vx*.025,sx=P.land?1.08:1,sy=P.land?.92:1;x.translate(q+P.w/2,y+P.h/2+bob);x.rotate(tilt);x.scale(P.face*sx,sy);x.drawImage(art.hero,-31,-42,62,78);x.restore();if(P.on&&Math.abs(P.vx)>3&&G.t%9===0)spawnBits(P.x+P.w/2,P.y+P.h,'#b99163');return}rect(q+8,y+23,23,32,'#166da0');rect(q+5,y+4,29,23,'#e79a34');rect(q+8,y,23,8,'#e9b129')}

function draw(){drawMountains();drawGiant();rect(0,ground(),W,105,'#30251b');rect(0,ground(),W,16,'#60705a');for(const p of platforms){let q=p.x-G.cam;rect(q,p.y,p.w,15,'#5d3421');rect(q,p.y,p.w,5,'#d18436');for(let k=12;k<p.w;k+=38){rect(q+k,p.y+15,7,28,'#34251f');x.strokeStyle='#7a4b2b';x.beginPath();x.moveTo(q+k,p.y+16);x.lineTo(q+k+32,p.y+42);x.stroke()}}for(let i=0;i<15;i++){let q=i*270-(G.cam%270);rect(q,ground()-22,42,22,i%2?'#70472b':'#344248');rect(q+8,ground()-30,26,8,'#a86b2c')}
 oils.forEach((o,i)=>{if(o.taken)return;let q=o.x-G.cam;if(q>-45&&q<W+45){let bob=Math.sin((G.t+i*7)*.08)*4;x.save();x.shadowColor='#ffc400';x.shadowBlur=10;if(art.oil.complete)x.drawImage(art.oil,q-8,o.y-9+bob,38,42);else{rect(q,o.y+bob,26,32,'#f6b51c');x.fillStyle='#111';x.font='bold 18px sans-serif';x.fillText('●',q+6,o.y+23+bob)}x.restore()}});if(checkpoint.active||Math.abs(checkpoint.x-P.x)<W){let q=checkpoint.x-G.cam;rect(q,ground()-84,8,84,'#ddd');rect(q+8,ground()-80,43,27,checkpoint.active?'#3edd69':'#ed9823');x.fillStyle='#111';x.font='bold 15px sans-serif';x.fillText('CP',q+18,ground()-61)}
 enemies.forEach(drawEnemy);wrenches.forEach(w=>{x.save();x.translate(w.x-G.cam+14,w.y+8);x.rotate(w.spin);rect(-14,-3,28,6,'#d7e1e5');x.restore()});particles.forEach(p=>rect(p.x-G.cam,p.y,4,4,p.col));drawPlayer();
 let rain=G.weather>1.05&&G.weather<1.9;if(rain){x.strokeStyle='#bde7ff88';x.lineWidth=2;for(let i=0;i<65;i++){let rx=(i*83+G.t*7)%W,ry=(i*47+G.t*13)%H;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+18);x.stroke()}}if(G.flash)rect(0,0,W,H,'#ffffff66');
 rect(10,10,270,66,'#07101ccc');x.fillStyle='white';x.font='bold 17px sans-serif';x.fillText('🔧 MECÂNICO',21,35);x.fillStyle='#ffc32c';x.fillText('ÓLEO '+String(G.oil).padStart(2,'0')+'/100',21,62);x.fillStyle='white';x.fillText('VIDAS '+G.lives,145,62);x.textAlign='right';x.fillText(G.score+' pts',W-70,35);x.textAlign='left';if(G.paused){rect(0,0,W,H,'#000a');x.fillStyle='#fff';x.font='bold 38px sans-serif';x.textAlign='center';x.fillText('PAUSADO',W/2,H/2);x.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
</script></body></html>
