<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Forja de Aço</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="1672" height="941" aria-label="Forja de Aço"></canvas>

    <section id="loading">
      <div class="brand">FORJA DE AÇO</div>
      <div class="subtitle">PROTÓTIPO DE PLATAFORMA</div>
      <div class="bar"><span></span></div>
    </section>

    <section id="intro" class="hidden">
      <div class="panel">
        <div class="eyebrow">FASE 1 · PRIMEIRA FUNDIÇÃO</div>
        <h1>Rota da Forja</h1>
        <p>Atravesse sete setores, domine as passarelas e alcance o portão industrial.</p>
        <button id="start">INICIAR FASE</button>
      </div>
    </section>

    <div id="hud" class="hidden">
      <div class="title">FORJA DE AÇO</div>
      <div id="status">SETOR 01 · PISO DE FUNDIÇÃO</div>
      <div id="fps">60 FPS</div>
      <button id="pause" aria-label="Pausar">Ⅱ</button>
    </div>

    <div id="controls" class="hidden">
      <div class="move-pad">
        <button id="left" aria-label="Mover para esquerda">‹</button>
        <button id="right" aria-label="Mover para direita">›</button>
      </div>
      <button id="jump" aria-label="Pular">⌃</button>
    </div>

    <section id="message" class="hidden"><div></div></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
