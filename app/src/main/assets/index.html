<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BeardedBR: Mecânico de Aço</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c;font-family:system-ui;color:#fff}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.ui{position:fixed;inset:0;pointer-events:none}.btn{pointer-events:auto;position:absolute;border:2px solid #f5a623;background:#151f2dcc;color:white;border-radius:50%;font-weight:900;box-shadow:0 3px 0 #0008;width:72px;height:72px;font-size:28px}.left{left:18px;bottom:22px}.right{left:100px;bottom:22px}.jump{right:20px;bottom:22px;background:#d87816cc}.throw{right:104px;bottom:96px;background:#2d79aacc;font-size:23px}.pause{right:12px;top:12px;width:45px;height:45px;font-size:18px}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#253851,#060b12 72%);z-index:4;text-align:center;padding:20px}.screen h1{color:#ffc341;text-shadow:0 5px #7b3c0a;font-size:clamp(38px,10vw,82px);margin:0}.screen h2{margin:8px}.screen p{max-width:620px}.screen button{padding:14px 32px;border:0;border-radius:10px;background:#f7a51a;font-size:20px;font-weight:900}.hidden{display:none}.logoBox{font-size:clamp(52px,14vw,112px);font-weight:1000;color:#ffbf23;letter-spacing:-5px;text-shadow:0 5px #873d00,3px 0 #fff3;margin-bottom:8px}.small{opacity:.8;font-size:13px}
</style></head>
<body><canvas id="game"></canvas>
<div class="ui" id="ui"><button class="btn left" data-k="left">◀</button><button class="btn right" data-k="right">▶</button><button class="btn throw" data-k="throw">🔧</button><button class="btn jump" data-k="jump">↑</button><button class="btn pause" data-k="pause">Ⅱ</button></div>
<div class="screen" id="menu"><div class="logoBox">BEARDEDBR</div><h2>MECÂNICO DE AÇO</h2><p>Corra pela fábrica abandonada, recolha latas de óleo e enfrente a invasão das máquinas.</p><button id="start">JOGAR</button><p class="small">Fase 1 — Vale da Sucata</p></div>
<div class="screen hidden" id="over"><h1 id="overTitle">FIM DE JOGO</h1><p id="overText"></p><button id="restart">JOGAR NOVAMENTE</button></div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,scale=1;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=devicePixelRatio;x.setTransform(scale,0,0,scale,0,0);W/=scale;H/=scale}addEventListener('resize',resize);resize();
const K={left:0,right:0,jump:0,throw:0},G={running:false,paused:false,t:0,cam:0,weather:0,flash:0,checkpoint:80,lives:3,oil:0,score:0,won:false};
let P, enemies, oils, wrenches, particles, checkpoint;
const ground=()=>H-105, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function reset(all=true){if(all){G.lives=3;G.oil=0;G.score=0;G.checkpoint=80}P={x:G.checkpoint,y:ground()-62,w:38,h:62,vx:0,vy:0,face:1,on:0,power:0,inv:0};wrenches=[];particles=[];checkpoint={x:1580,active:G.checkpoint>100};
 enemies=[{x:520,type:'walker'},{x:890,type:'roller'},{x:1250,type:'fly',y:ground()-145},{x:1470,type:'walker'},{x:1860,type:'fly',y:ground()-180},{x:2070,type:'roller'},{x:2440,type:'walker'},{x:2720,type:'fly',y:ground()-155},{x:3050,type:'walker'}].map((e,i)=>Object.assign({w:44,h:42,y:e.y||ground()-42,vx:i%2?-.8:.8,hp:1,dead:0,phase:i},e));
 oils=[];for(let i=0;i<38;i++)oils.push({x:250+i*82+(i%4)*13,y:ground()-55-(i%6===2?75:0),w:22,h:28,taken:0});}
function spawnBits(px,py,col='#f90'){for(let i=0;i<9;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:-Math.random()*5,l:35,col})}
function damage(){if(P.inv)return;G.lives--;if(G.lives<0)return end(false);P.x=G.checkpoint;P.y=ground()-80;P.vx=0;P.vy=0;P.inv=120}
function end(win){G.running=false;G.won=win;overTitle.textContent=win?'FASE CONCLUÍDA!':'FIM DE JOGO';overText.textContent=win?'O gigante observou sua chegada. A batalha está apenas começando…':'Os robôs dominaram a oficina. Tente novamente!';over.classList.remove('hidden')}
function input(k,on){if(k==='pause'&&on){G.paused=!G.paused;return}K[k]=on?1:0}
document.querySelectorAll('[data-k]').forEach(b=>{for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();input(b.dataset.k,1)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>input(b.dataset.k,0))});
addEventListener('keydown',e=>input({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',Space:'jump',KeyX:'throw',KeyP:'pause'}[e.code],1));addEventListener('keyup',e=>input({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',Space:'jump',KeyX:'throw'}[e.code],0));
start.onclick=()=>{menu.classList.add('hidden');G.running=true;reset(true)};restart.onclick=()=>{over.classList.add('hidden');G.running=true;reset(true)};
let jumpLock=0,throwLock=0;
function update(){if(!G.running||G.paused)return;G.t++;G.weather=(G.t/900)%3;P.inv=Math.max(0,P.inv-1);P.vx+=(K.right-K.left)*.55;P.vx*=.84;P.vx=clamp(P.vx,-5,5);if(P.vx)P.face=Math.sign(P.vx);if(K.jump&&P.on&&!jumpLock){P.vy=-12.5;P.on=0;jumpLock=1}if(!K.jump)jumpLock=0;if(K.throw&&P.power&&!throwLock){wrenches.push({x:P.x+20,y:P.y+22,vx:P.face*9,vy:-1,w:28,h:16,spin:0});throwLock=1}if(!K.throw)throwLock=0;
 P.vy+=.62;P.x+=P.vx;P.y+=P.vy;P.x=clamp(P.x,0,3380);if(P.y+P.h>=ground()){P.y=ground()-P.h;P.vy=0;P.on=1}if(P.y>H+100)damage();G.cam=clamp(P.x-W*.38,0,3400-W);
 if(P.x>420)P.power=1;if(P.x>checkpoint.x&&!checkpoint.active){checkpoint.active=1;G.checkpoint=checkpoint.x;G.score+=500;spawnBits(checkpoint.x,ground()-50,'#52ff7a')}
 oils.forEach(o=>{if(!o.taken&&hit(P,o)){o.taken=1;G.oil++;G.score+=25;spawnBits(o.x,o.y,'#f3c51f');if(G.oil>=100){G.oil-=100;G.lives++}}});
 enemies.forEach(e=>{if(e.dead)return;if(e.type==='fly'){e.x+=Math.sin((G.t+e.phase*40)/55)*.7;e.y+=Math.sin((G.t+e.phase*25)/27)*.8}else{e.x+=e.vx;if(Math.abs(e.x-(e.type==='walker'?520+e.phase*290:890+e.phase*260))>90)e.vx*=-1}if(hit(P,e)){if(e.type!=='fly'&&P.vy>2&&P.y+P.h<e.y+24){e.dead=1;P.vy=-8;G.score+=150;spawnBits(e.x,e.y,'#ff5138')}else damage()}});
 wrenches.forEach(w=>{w.x+=w.vx;w.y+=w.vy;w.spin+=.4;enemies.forEach(e=>{if(!e.dead&&hit(w,e)){e.dead=1;w.dead=1;G.score+=e.type==='fly'?250:150;spawnBits(e.x,e.y,'#ff5138')}})});wrenches=wrenches.filter(w=>!w.dead&&Math.abs(w.x-P.x)<900);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l--});particles=particles.filter(p=>p.l>0);if(P.x>3330)end(true);if(Math.random()<.0015)G.flash=5;G.flash=Math.max(0,G.flash-1)}
function rect(a,b,d,e,col){x.fillStyle=col;x.fillRect(a,b,d,e)}
function drawMountains(){let dusk=G.weather>1?1:0;let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,dusk?'#15213b':'#398bc4');sky.addColorStop(1,dusk?'#d06638':'#b6e4e9');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#ffffff88';for(let i=0;i<6;i++){let q=(i*310-G.cam*.12)%1900-100;x.beginPath();x.arc(q,75+(i%3)*35,35,0,7);x.arc(q+35,80+(i%3)*35,50,0,7);x.fill()}x.fillStyle='#29475b';x.beginPath();x.moveTo(0,ground());for(let i=0;i<10;i++){let q=i*260-(G.cam*.22%260);x.lineTo(q,ground()-130-(i%3)*55);x.lineTo(q+180,ground())}x.fill();x.fillStyle='#37677a';x.beginPath();x.moveTo(0,ground());for(let i=0;i<12;i++){let q=i*190-(G.cam*.38%190);x.lineTo(q,ground()-65-(i%4)*30);x.lineTo(q+150,ground())}x.fill()}
function drawGiant(){if(G.t>820)return;let gx=800-G.t*.55-G.cam*.08;if(G.t>440&&G.t<620)gx=558-G.cam*.08;let gy=ground()-285;rect(gx+25,gy,100,165,'#17222a');rect(gx,gy+42,150,76,'#25323a');rect(gx+12,gy+145,44,95,'#151d22');rect(gx+94,gy+145,44,95,'#151d22');rect(gx+40,gy-35,70,55,'#202d35');x.fillStyle='#ff1f1f';x.shadowColor='red';x.shadowBlur=18;x.fillRect(gx+53,gy-15,12,8);x.fillRect(gx+85,gy-15,12,8);x.shadowBlur=0}
function drawPlayer(){if(P.inv%8>4)return;let q=P.x-G.cam, y=P.y;rect(q+8,y+23,23,32,'#166da0');rect(q+5,y+4,29,23,'#e79a34');rect(q+8,y,23,8,'#e9b129');rect(q+12,y+27,15,12,'#e0a56a');rect(q+5,y+54,12,8,'#20262b');rect(q+23,y+54,12,8,'#20262b');rect(q+(P.face>0?29:2),y+30,10,7,'#f0bd78')}
function drawEnemy(e){if(e.dead)return;let q=e.x-G.cam,y=e.y;if(e.type==='fly'){rect(q+5,y+9,34,27,'#7a348e');rect(q-8,y+3,14,8,'#a7d4e8');rect(q+38,y+3,14,8,'#a7d4e8');rect(q+14,y+17,6,5,'#ff3131');rect(q+26,y+17,6,5,'#ff3131')}else if(e.type==='roller'){x.fillStyle='#444';x.beginPath();x.arc(q+22,y+22,21,0,7);x.fill();rect(q+8,y+7,28,18,'#b64c25');rect(q+14,y+12,5,5,'#ff2b20');rect(q+27,y+12,5,5,'#ff2b20')}else{rect(q+4,y+5,36,29,'#48616b');rect(q,y+34,16,8,'#242d31');rect(q+28,y+34,16,8,'#242d31');rect(q+11,y+13,6,6,'#ff2b20');rect(q+27,y+13,6,6,'#ff2b20')}}
function draw(){drawMountains();drawGiant();rect(0,ground(),W,105,'#533a25');rect(0,ground(),W,16,'#777f67');for(let i=0;i<26;i++)rect(i*150-(G.cam%150),ground()+18,110,10,'#30271e');
 oils.forEach(o=>{if(o.taken)return;let q=o.x-G.cam;if(q>-30&&q<W+30){rect(q,o.y,22,28,'#f6b51c');rect(q+3,o.y+4,16,5,'#fff082');rect(q+7,o.y+11,8,11,'#3c2a1d')}});if(checkpoint.active||Math.abs(checkpoint.x-P.x)<W){let q=checkpoint.x-G.cam;rect(q,ground()-84,8,84,'#ddd');rect(q+8,ground()-80,43,27,checkpoint.active?'#3edd69':'#ed9823');x.fillStyle='#111';x.font='bold 15px sans-serif';x.fillText('CP',q+18,ground()-61)}
 enemies.forEach(drawEnemy);wrenches.forEach(w=>{x.save();x.translate(w.x-G.cam+14,w.y+8);x.rotate(w.spin);rect(-14,-3,28,6,'#d7e1e5');x.restore()});particles.forEach(p=>rect(p.x-G.cam,p.y,4,4,p.col));drawPlayer();
 let rain=G.weather>1.05&&G.weather<1.9;if(rain){x.strokeStyle='#bde7ff88';x.lineWidth=2;for(let i=0;i<65;i++){let rx=(i*83+G.t*7)%W,ry=(i*47+G.t*13)%H;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+18);x.stroke()}}if(G.flash)rect(0,0,W,H,'#ffffff66');
 rect(10,10,270,66,'#07101ccc');x.fillStyle='white';x.font='bold 17px sans-serif';x.fillText('🔧 MECÂNICO',21,35);x.fillStyle='#ffc32c';x.fillText('ÓLEO '+String(G.oil).padStart(2,'0')+'/100',21,62);x.fillStyle='white';x.fillText('VIDAS '+G.lives,145,62);x.textAlign='right';x.fillText(G.score+' pts',W-70,35);x.textAlign='left';if(G.paused){rect(0,0,W,H,'#000a');x.fillStyle='#fff';x.font='bold 38px sans-serif';x.textAlign='center';x.fillText('PAUSADO',W/2,H/2);x.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
</script></body></html>
