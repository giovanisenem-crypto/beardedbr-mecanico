 if(['spider','piston','scout','sentry'].includes(e.type)&&img.complete){let size={spider:[92,76],piston:[78,92],scout:[88,82],sentry:[76,98]}[e.type],fly=e.type==='scout';x.save();x.translate(q+e.w/2,y+e.h/2+(fly?0:bob));if(!fly)x.scale(Math.sign(e.vx)||1,1);else x.rotate(Math.sin((G.t+e.phase)*.18)*.12);x.shadowColor=fly?'#ff8a20':'#ff351c';x.shadowBlur=8;x.drawImage(img,-size[0]/2,-size[1]/2,size[0],size[1]);x.restore();return}
 if(e.type==='walker'&&art.blade.complete){x.save();x.translate(q+24,y+22+bob);x.scale(Math.sign(e.vx)||1,1);x.drawImage(art.blade,-38,-52,76,84);x.restore();return}
 if(e.type==='heavy'&&art.heavy.complete){x.save();x.translate(q+31,y+29+bob*.35);x.scale(Math.sign(e.vx)||1,1);x.shadowColor='#ff3b20';x.shadowBlur=7;x.drawImage(art.heavy,-47,-48,94,96);x.restore();return}
 if(e.type==='roller'&&art.roller.complete){x.save();x.translate(q+24,y+24);x.rotate((e.x-e.ox)*.035);x.drawImage(art.roller,-31,-31,62,62);x.restore();return}
 if(e.type==='fly'&&art.drone.complete){x.save();x.translate(q+24,y+22);x.rotate(Math.sin((G.t+e.phase)*.16)*.16);x.shadowColor='#ffb51b';x.shadowBlur=12;x.drawImage(art.drone,-55,-48,110,96);x.fillStyle='#9df5ff';x.fillRect(-35,-38+Math.sin(G.t*.45)*3,20,3);x.fillRect(15,-38-Math.sin(G.t*.45)*3,20,3);x.restore();return}rect(q-8,y-8,60,50,'#7a348e')}
function drawBossIntro(){if(!G.running||G.t>=300)return;let a=Math.min(1,G.t/45),shake=G.t>55?Math.sin(G.t*.8)*3:0;rect(0,0,W,H,'#020305dd');if(art.boss.complete){let sc=Math.min(W*.88/880,H*.72/720),bw=880*sc,bh=720*sc;x.save();x.globalAlpha=a;x.shadowColor='#f00';x.shadowBlur=38;x.drawImage(art.boss,(W-bw)/2+shake,(H-bh)/2,bw,bh);x.restore()}rect(0,0,W,38,'#000');rect(0,H-44,W,44,'#000');x.fillStyle='#ff392d';x.font=`bold ${Math.min(22,W/28)}px sans-serif`;x.textAlign='center';x.fillText('⚠ AMEAÇA DETECTADA: UNIDADE B-01',W/2,H-15);x.textAlign='left'}
function draw(){drawMountains();drawGiant();x.save();x.translate(0,-G.camY);rect(0,ground(),W,105,'#30251b');rect(0,ground(),W,16,'#60705a');for(const p of platforms){let q=p.x-G.cam;rect(q,p.y,p.w,15,'#5d3421');rect(q,p.y,p.w,5,'#d18436');for(let k=12;k<p.w;k+=38){rect(q+k,p.y+15,7,28,'#34251f');x.strokeStyle='#7a4b2b';x.beginPath();x.moveTo(q+k,p.y+16);x.lineTo(q+k+32,p.y+42);x.stroke()}}for(let i=0;i<15;i++){let q=i*270-(G.cam%270);rect(q,ground()-22,42,22,i%2?'#70472b':'#344248');rect(q+8,ground()-30,26,8,'#a86b2c')}
oils.forEach((o,i)=>{if(o.taken)return;let q=o.x-G.cam;if(q>-45&&q<W+45){let bob=Math.sin((G.t+i*7)*.08)*4;x.save();x.shadowColor='#ffc400';x.shadowBlur=10;if(art.oil.complete)x.drawImage(art.oil,q-8,o.y-9+bob,38,42);else rect(q,o.y+bob,26,32,'#f6b51c');x.restore()}});for(const cp of [checkpoint,checkpoint2,checkpoint3,checkpoint4])if(cp.active||Math.abs(cp.x-P.x)<W){let q=cp.x-G.cam;if(art.flag.complete){x.save();x.translate(q-8,ground()-104);x.transform(1,0,Math.sin((G.t+cp.x)*.09)*.025,1,0,0);x.shadowColor=cp.active?'#4cff63':'#f90';x.shadowBlur=10;x.drawImage(art.flag,0,0,87,100);x.restore()}else{rect(q,ground()-96,10,96,'#c7d0d3');rect(q+10,ground()-82,52,28,'#ed9823')}}
 enemies.forEach(drawEnemy);wrenches.forEach(drawWrench);particles.forEach(p=>rect(p.x-G.cam,p.y,4,4,p.col));drawPlayer();x.restore();
 drawBossIntro();
 rect(10,10,290,66,'#07101ccc');x.fillStyle='white';x.font='bold 17px sans-serif';x.fillText('🔧 MECÂNICO',21,35);x.fillStyle='#ffc32c';x.fillText('ÓLEO '+String(G.oil).padStart(2,'0')+'/100',21,62);x.fillStyle='white';x.fillText('VIDAS '+G.lives,145,62);x.fillStyle='#6fe3ff';x.fillText(Math.min(100,Math.floor(P.x/WORLD_END*100))+'%',225,62);x.textAlign='right';x.fillText(G.score+' pts',W-70,35);x.textAlign='left';if(G.paused){rect(0,0,W,H,'#000a');x.fillStyle='#fff';x.font='bold 38px sans-serif';x.textAlign='center';x.fillText('PAUSADO',W/2,H/2);x.textAlign='left'}}
let lastFrame=performance.now(),fpsClock=lastFrame,fpsFrames=0;function loop(now){let dt=now-lastFrame;lastFrame=now;fpsFrames++;if(now-fpsClock>1000){G.fps=Math.round(fpsFrames*1000/(now-fpsClock));G.low=G.fps<48;fpsFrames=0;fpsClock=now}update();draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
